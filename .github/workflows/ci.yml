# TASKS T0.6 — analyze, test, Android debug build; iOS no-codesign build.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      # Goldens are macOS-rendered (font rasterisation differs on Linux); run them locally.
      - run: flutter test --exclude-tags golden
      - name: PDF engine on real PDFium (host build)
        run: PDFIUM_PATH=$(find .dart_tool -name libpdfium.so -path '*linux-x64*' | head -1) flutter test test/core/pdf_engine_host_test.dart test/core/pdf_stamper_host_test.dart
      # ADS.md §7: only lib/core/ads/ may import google_mobile_ads / in_app_purchase.
      - run: tool/check_ads_imports.sh
      # FR-PRT-07 / FR-UNL-07: no logging call mentions a password (app + native plugin).
      - run: tool/check_no_password_logs.sh
      # No hard-coded user-visible strings in widgets (TASKS T0.4): fail on Text('…') literals.
      - run: "! grep -rnE \"Text\\('[A-Za-z]\" lib --include=*.dart"
      - run: flutter build apk --debug

  ios:
    runs-on: macos-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --no-codesign --debug
