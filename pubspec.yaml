name: docukit
description: "DocuKit — offline document tools for Android and iOS."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.11.1

# Exact pins (ARCHITECTURE §1 dependency rule). Versions are the newest that
# resolve against Flutter 3.41.4 / Dart 3.11.1 — see DECISIONS ADR-017.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: 4.0.9
  crypto: 3.0.8
  drift: 2.34.4
  drift_flutter: 0.3.1
  ffi: 2.2.0
  file_picker: 13.3.0
  flutter_image_compress: 2.5.1
  flutter_riverpod: 3.3.2
  gal: 2.3.3
  go_router: 17.5.0
  google_mlkit_text_recognition: 0.17.1
  image: 4.10.0
  image_picker: 1.2.4
  intl: 0.20.3
  package_info_plus: 10.2.2
  path: 1.9.1
  path_provider: 2.1.6
  pdf: 3.12.0
  pdfium_dart: 0.4.0
  pdfrx: 2.10.1
  share_plus: 13.3.1
  shared_preferences: 2.5.6
  url_launcher: 6.3.3
  uuid: 4.6.0
  docukit_native:
    path: packages/docukit_native
  google_mobile_ads: 9.2.0
  in_app_purchase: 3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.34.0
  build_runner: 2.15.1
  mocktail: 1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/OFL-Noto.txt
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSansDevanagari-Regular.ttf
  fonts:
    # Headings only (ADR-032, UI_REFRESH §1). SIL OFL 1.1 — licence registered in app.dart.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
